name: Android Test Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string
      title:
        description: Release title
        required: false
        type: string
      notes:
        description: Release notes
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-test-release:
    name: Build arm64-v8a test APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate test signing secrets
        env:
          TEST_SIGNING_STORE_BASE64: ${{ secrets.TEST_SIGNING_STORE_BASE64 }}
          TEST_SIGNING_STORE_PASSWORD: ${{ secrets.TEST_SIGNING_STORE_PASSWORD }}
          TEST_SIGNING_KEY_ALIAS: ${{ secrets.TEST_SIGNING_KEY_ALIAS }}
          TEST_SIGNING_KEY_PASSWORD: ${{ secrets.TEST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TEST_SIGNING_STORE_BASE64"
          test -n "$TEST_SIGNING_STORE_PASSWORD"
          test -n "$TEST_SIGNING_KEY_ALIAS"
          test -n "$TEST_SIGNING_KEY_PASSWORD"

      - name: Prepare test signing key
        env:
          TEST_SIGNING_STORE_BASE64: ${{ secrets.TEST_SIGNING_STORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$TEST_SIGNING_STORE_BASE64" | base64 -d > android-test-signing-key.jks

      - name: Write local.properties
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          ani.android.abis=arm64-v8a
          kotlin.native.ignoreDisabledTargets=true
          jvm.toolchain.version=21
          EOF
          cat >> local.properties <<EOF
          ani.dandanplay.app.id=${{ secrets.DANDANPLAY_APP_ID }}
          ani.dandanplay.app.secret=${{ secrets.DANDANPLAY_APP_SECRET }}
          ani.sentry.dsn=${{ secrets.SENTRY_DSN }}
          EOF

      - name: Use debug package name for release build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          android_gradle = Path("app/android/build.gradle.kts")
          text = android_gradle.read_text()
          patched = text.replace(
              'applicationId = "me.him188.ani"',
              'applicationId = "me.him188.ani.debug2"',
          )
          if patched == text:
              raise SystemExit("failed to patch Android applicationId")
          android_gradle.write_text(patched)

          build_config_gradle = Path("utils/build-config/build.gradle.kts")
          text = build_config_gradle.read_text()
          patched = text.replace(
              'buildConfigField("String", "APP_APPLICATION_ID", "\\"${idGroup}\\"")',
              'buildConfigField("String", "APP_APPLICATION_ID", "\\"${idGroup}.debug2\\"")',
          )
          if patched == text:
              raise SystemExit("failed to patch AndroidBuildConfig APP_APPLICATION_ID")
          build_config_gradle.write_text(patched)
          PY

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build signed release APK with debug package name
        env:
          signing_release_storeFileFromRoot: android-test-signing-key.jks
          signing_release_storePassword: ${{ secrets.TEST_SIGNING_STORE_PASSWORD }}
          signing_release_keyAlias: ${{ secrets.TEST_SIGNING_KEY_ALIAS }}
          signing_release_keyPassword: ${{ secrets.TEST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:android:assembleDefaultRelease -Pani.android.abis=arm64-v8a --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/android/build/outputs/apk/default/release/android-default-arm64-v8a-release.apk \
            dist/animeko-test-arm64-v8a.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeko-test-arm64-v8a
          path: dist/animeko-test-arm64-v8a.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          title="${TITLE:-$TAG}"
          notes="${NOTES:-Animeko test build. Signed with the test release key and installed as me.him188.ani.debug2.}"
          asset="dist/animeko-test-arm64-v8a.apk#animeko-test-arm64-v8a.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
